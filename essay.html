<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Essay — Kill James Bond! vs The Bechdel Cast</title>
<meta name="description" content="Draft essay from Liam Gomez-Kervin's comparative discourse study.">
<style>
:root{--paper:#f5f1e8;--ink:#181818;--muted:#6d675e;--line:#d8d0c2;--accent:#7c2d2d;--soft:#ece5d8}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.7}a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}.top{position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.topin{width:min(900px,calc(100% - 30px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0}.home{font:750 13px/1.2 ui-sans-serif,system-ui,sans-serif;text-decoration:none;color:var(--ink)}.draft{font:700 10px/1 ui-sans-serif,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}main{width:min(900px,calc(100% - 30px));margin:auto;padding:50px 0 90px}.meta{font:700 11px/1.3 ui-sans-serif,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.11em;color:var(--accent);margin:0 0 18px}.article{max-width:760px;margin:auto}.article h1{font-size:clamp(2.45rem,6vw,4.7rem);line-height:1;letter-spacing:-.045em;font-weight:500;margin:0 0 10px}.article h2{font-size:1.25rem;font-weight:500;color:var(--muted);line-height:1.35;margin:0 0 44px}.article h3{font-size:1.3rem;line-height:1.25;margin:48px 0 18px}.article h4{font-size:1.05rem;margin:32px 0 12px}.article p{font-size:1.055rem;margin:0 0 1.25em}.article strong{font-weight:700}.article em{font-style:italic}.article blockquote{margin:1.5em 0;padding:.2em 0 .2em 20px;border-left:3px solid var(--line);color:var(--muted)}.article ul,.article ol{padding-left:1.4em;margin:0 0 1.4em}.article li{margin:.3em 0}.article hr{border:0;border-top:1px solid var(--line);margin:42px 0}.article table{width:100%;border-collapse:collapse;font-size:.9rem;margin:1.5em 0;display:block;overflow-x:auto}.article th,.article td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}.article code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.88em;background:var(--soft);padding:.1em .3em;border-radius:3px}.article pre{overflow:auto;background:#211f1c;color:#f2eee6;padding:16px;border-radius:4px;line-height:1.5}.article pre code{background:none;padding:0;color:inherit}.xref{background:linear-gradient(transparent 68%,rgba(124,45,45,.12) 0);text-decoration:none;color:inherit}.xref:hover{color:var(--accent)}.chapter-nav{max-width:760px;margin:58px auto 0;padding-top:18px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}.chapter-nav a{font:700 13px/1.35 ui-sans-serif,system-ui,sans-serif;text-decoration:none;color:var(--ink)}.chapter-nav .next{text-align:right}.chapter-nav .all{color:var(--muted);font-weight:600}.chapter-nav small{display:block;color:var(--muted);font-weight:500;margin-bottom:3px}.error{max-width:760px;margin:80px auto;font-size:1.1rem}@media(max-width:620px){main{padding-top:36px}.article h2{margin-bottom:34px}.chapter-nav{grid-template-columns:1fr 1fr}.chapter-nav .all{display:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div class="top"><div class="topin"><a class="home" href="./">← Essays</a><span class="draft">unfinished study</span></div></div>
<main><div id="meta" class="meta"></div><article id="article" class="article"></article><nav id="nav" class="chapter-nav" aria-label="Essay navigation"></nav></main>
<script>
const chapters=[
{id:'01_the_rock',n:'01',title:'The Rock'},
{id:'02_casino_royale',n:'02',title:'Casino Royale'},
{id:'03_austin_powers',n:'03',title:'Austin Powers'},
{id:'04_oceans_eleven',n:'04',title:'Ocean’s Eleven'},
{id:'05_atomic_blonde',n:'05',title:'Atomic Blonde'},
{id:'06_point_break',n:'06',title:'Point Break'},
{id:'07_die_hard',n:'07',title:'Die Hard'},
{id:'08_fast_furious',n:'08',title:'The Fast and the Furious'},
{id:'09_preview_pairs_composite',n:'09',title:'The preview pairs'},
{id:'10_three_poles_atomic_blonde',n:'10',title:'Three poles, one film'}
];
const aliases={
'The Rock':'01_the_rock','Essay 01':'01_the_rock','Essay 1':'01_the_rock',
'Casino Royale':'02_casino_royale','Essay 02':'02_casino_royale','Essay 2':'02_casino_royale',
'Austin Powers: International Man of Mystery':'03_austin_powers','Austin Powers':'03_austin_powers','Essay 03':'03_austin_powers','Essay 3':'03_austin_powers',
"Ocean's Eleven":'04_oceans_eleven','Ocean’s Eleven':'04_oceans_eleven','Essay 04':'04_oceans_eleven','Essay 4':'04_oceans_eleven',
'Atomic Blonde':'05_atomic_blonde','Essay 05':'05_atomic_blonde','Essay 5':'05_atomic_blonde',
'Point Break':'06_point_break','Essay 06':'06_point_break','Essay 6':'06_point_break',
'Die Hard':'07_die_hard','Essay 07':'07_die_hard','Essay 7':'07_die_hard',
'The Fast and the Furious':'08_fast_furious','Fast and the Furious':'08_fast_furious','Fast & Furious':'08_fast_furious','Essay 08':'08_fast_furious','Essay 8':'08_fast_furious',
'The preview pairs':'09_preview_pairs_composite','preview pairs':'09_preview_pairs_composite','Essay 09':'09_preview_pairs_composite','Essay 9':'09_preview_pairs_composite',
'Three poles, one film':'10_three_poles_atomic_blonde','three poles':'10_three_poles_atomic_blonde','Essay 10':'10_three_poles_atomic_blonde'
};
const id=new URLSearchParams(location.search).get('e');
const idx=chapters.findIndex(c=>c.id===id);
const article=document.getElementById('article'), meta=document.getElementById('meta'), nav=document.getElementById('nav');
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function linkReferences(root,current){
  const names=Object.keys(aliases).sort((a,b)=>b.length-a.length);
  const re=new RegExp('('+names.map(esc).join('|')+')','gi');
  const lookup={}; for(const [name,target] of Object.entries(aliases)) lookup[name.toLowerCase()]=target;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){
    const p=node.parentElement;if(!p||p.closest('a,code,pre,h1,h2,h3,h4,h5,h6,script,style'))return NodeFilter.FILTER_REJECT;
    return re.test(node.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
  }}); re.lastIndex=0;
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  for(const node of nodes){
    const text=node.nodeValue; re.lastIndex=0; let last=0,m; const frag=document.createDocumentFragment();
    while((m=re.exec(text))){
      const target=lookup[m[0].toLowerCase()];
      if(m.index>last)frag.append(text.slice(last,m.index));
      if(target&&target!==current){const a=document.createElement('a');a.href='essay.html?e='+target;a.className='xref';a.textContent=m[0];frag.append(a)}else frag.append(m[0]);
      last=m.index+m[0].length;
    }
    if(last<text.length)frag.append(text.slice(last)); node.replaceWith(frag);
  }
}
function renderNav(i){
  const prev=chapters[i-1],next=chapters[i+1];
  nav.innerHTML=`${prev?`<a href="essay.html?e=${prev.id}"><small>Previous</small>${prev.n} · ${prev.title}</a>`:'<span></span>'}<a class="all" href="./">All essays</a>${next?`<a class="next" href="essay.html?e=${next.id}"><small>Next</small>${next.n} · ${next.title}</a>`:'<span></span>'}`;
}
async function load(){
  if(idx<0){article.innerHTML='<div class="error">Essay not found. <a href="./">Back to the essays.</a></div>';return}
  const c=chapters[idx]; meta.textContent='Essay '+c.n+' · draft'; document.title=c.title+' — Kill James Bond! vs The Bechdel Cast';
  try{
    const r=await fetch('essays/'+c.id+'.md'); if(!r.ok)throw new Error('not found');
    const md=await r.text(); marked.setOptions({gfm:true,breaks:false}); article.innerHTML=marked.parse(md);
    linkReferences(article,c.id); renderNav(idx);
  }catch(e){article.innerHTML='<div class="error">This draft could not be loaded. <a href="./">Back to the essays.</a></div>'}
}
load();
</script>
</body></html>
